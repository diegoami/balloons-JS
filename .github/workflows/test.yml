# `npm test`, eight times, on the commit a pull request would merge.
#
# CLAUDE.md asks for eight runs after the last edit, because the browser suite
# has timing in it and three passes once let a one-in-eight flake through
# twice. Written into a PR body, that record is taken at the first commit and
# never updated, so the fixes a review asks for landed unrecorded. Here the
# record is attached to the head commit, and a new push replaces it.
#
# The eight are separate jobs rather than a loop, so a flake shows up as one
# red leg among seven green ones and its log stands on its own.
name: test

on:
  pull_request:
  push:
    branches: [master]

# A new push to the same branch makes the running set moot.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: npm test (${{ matrix.run }}/8)
    # Pinned rather than ubuntu-latest, which moves to Ubuntu 26 on
    # 2026-10-19. The browser suite has timing in it, so the machine under it
    # should change when someone decides to, not on a label's schedule.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # Keep going when one fails: how many of the eight fail is the finding.
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test 2>&1 | tee test.log
        shell: bash  # -o pipefail, so tee does not hide npm's exit code
      # Green says nothing failed; the count says nothing went missing. A
      # test that stops registering still exits 0, so put the numbers where
      # they can be read against the last run. As annotations, because those
      # show on the run page signed in or not and come back from the API; a
      # step summary does neither. No count at all fails the step.
      - name: Counts
        if: always()
        shell: bash
        run: |
          grep -E '^[0-9]+ passed' test.log | while read -r line; do
            echo "::notice title=npm test ${{ matrix.run }}/8::$line"
          done
