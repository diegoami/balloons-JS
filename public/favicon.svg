<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Balloon">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B5FA8"/>
      <stop offset="1" stop-color="#8CC6EA"/>
    </linearGradient>
    <linearGradient id="skin" x1=".25" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#FFE3A8"/>
      <stop offset=".55" stop-color="#FFCE73"/>
      <stop offset="1" stop-color="#E09A32"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#sky)"/>

  <!-- The same silhouette the game draws: a circle, closed by a tie beneath
       it. One string curve, not two, because at 16px a second only muddies
       the shape. -->
  <circle cx="16" cy="13.4" r="9.3" fill="url(#skin)"/>
  <path d="M13.3 21.8h5.4L16 25.6z" fill="#E09A32"/>
  <ellipse cx="12.4" cy="10.4" rx="2.7" ry="3.8" transform="rotate(-28 12.4 10.4)"
           fill="#FFFFFF" opacity=".5"/>
  <path d="M16 25.6c1.1 1.3-1.3 1.9-.2 3.2" stroke="#FFFFFF" stroke-width="1.4"
        stroke-linecap="round" fill="none" opacity=".9"/>
</svg>
